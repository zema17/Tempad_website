<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tempad - Quảng Cáo Đa Nền Tảng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="js/script_dv.js"></script>

    <link rel="stylesheet" href="css/style_dv.css">
    <link rel="stylesheet" href="css/btn_keo.css"> 
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Trang chu</a></li>
            <li><a href="intro.html">Gioi thieu</a></li>
            <li><a href="service.html">Dich vu</a></li>
            <li><a href="contact.html">Lien he</a></li>
        </ul>
        <li><a href="login.html" id="loginButton" class="login-btn">Đăng nhập</a></li>
    </nav>
    <script src="js/auth.js"></script>
    <script src="js/get_user.js"></script>
    <div class="container-custom">
        <!-- Bên trái: Nội dung -->
        <div class="left-content">
            <h1><span style="color: #007bff;">MASON</span> - Technology Service</h1>
            <p>We create product inspiring firm with profession and convenience.</p>
        </div>

        <!-- Bên phải: Form -->
        <div class="right-form">
            <h4>📞 Liên hệ tư vấn</h4>
            <form>
                <div class="mb-3">
                    <label class="form-label">* Họ tên</label>
                    <input type="text" class="form-control" placeholder="Nhập họ tên của bạn">
                </div>
                <div class="mb-3">
                    <label class="form-label">* Số điện thoại</label>
                    <input type="tel" class="form-control" placeholder="Nhập số điện thoại">
                </div>
                <div class="mb-3">
                    <label class="form-label">Gói dịch vụ</label>
                    <select class="form-select">
                        <option selected>--Services--</option>
                        <option value="1">IOT</option>
                        <option value="2">WEBSITE</option>
                        <option value="3">SOFTWARE</option>
                        <option value="4">HARDWARE</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">📩 Đặt hàng ngay</button>
            </form>
        </div>
    </div>
    <a href="add_product.html">
    <button id="draggable">🐱</button>    
    </a>
